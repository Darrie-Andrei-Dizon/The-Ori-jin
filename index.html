<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jin Pastry – Coming Soon</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 60px auto; padding: 0 16px; text-align: center; }
    button { padding: 12px 20px; font-size: 16px; border-radius: 8px; border: none; background: #b5651d; color: #fff; cursor: pointer; }
    #result { margin-top: 20px; font-family: monospace; word-break: break-word; }
  </style>
</head>
<body>
  <h1>Jin Pastry</h1>
  <p>It works! Real site coming soon.</p>
  <button id="testBtn">Send test order</button>
  <div id="result"></div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbwC418OU8M0DlPuALSJTfmEigXcauXHfc7lkcV_KlpcwEE8n3q6hQ7sVlsG8I3hDqce/exec';

    document.getElementById('testBtn').addEventListener('click', async () => {
      const result = document.getElementById('result');
      result.textContent = 'Sending...';
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            name: 'Website Test', contact: '09xxxxxxxxx',
            items: [{ name: 'Ensaymada', qty: 1 }],
            total: 60, mode: 'Pickup', address: '', notes: 'sent from GitHub Pages'
          })
        });
        const data = await res.json();
        result.textContent = JSON.stringify(data);
      } catch (err) {
        result.textContent = 'Error: ' + err;
      }
    });
  </script>
</body>
</html>
